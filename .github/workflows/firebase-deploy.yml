name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: VibeStore/package.json
    
    - name: Install Jekyll dependencies
      working-directory: ./VibeStore
      run: |
        bundle install
    
    - name: Build Jekyll site
      working-directory: ./VibeStore
      run: |
        bundle exec jekyll build
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Deploy to Firebase Hosting
      working-directory: ./VibeStore
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase deploy --only hosting --token "$FIREBASE_TOKEN" --project vibestore-7af1e --non-interactive

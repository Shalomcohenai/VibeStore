<div class="blog-categories">
  <h2>Explore Categories</h2>
  <div class="categories-grid">
    {% for category in site.data.blog-categories.categories %}
    <a href="/blog/category/{{ category.slug }}/" class="category-card" style="--category-color: {{ category.color }}">
      <div class="category-icon">{{ category.icon }}</div>
      <h3>{{ category.name }}</h3>
      <p>{{ category.description }}</p>
    </a>
    {% endfor %}
  </div>
</div>

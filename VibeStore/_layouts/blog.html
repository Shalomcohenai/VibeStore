---
layout: default
---
<div class="blog-page">
  <header class="blog-header">
    <h1>{{ page.title }}</h1>
    <p class="blog-description">{{ page.description }}</p>
  </header>

  <!-- Search Bar -->
  <div class="blog-search-container">
    <div class="search-wrapper">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input 
        type="text" 
        id="blog-search" 
        class="blog-search-input" 
        placeholder="חפש כתבות, נושאים, תגיות..."
        autocomplete="off"
      />
      <button class="search-clear" id="search-clear" style="display: none;" aria-label="נקה חיפוש">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Categories Filter -->
  <div class="blog-categories-filter">
    <button class="category-filter-btn active" data-category="all">
      <span>הכל</span>
    </button>
    <!-- Categories will be dynamically added here -->
  </div>

  <!-- Blog Content -->
  <div class="blog-content">
    <div id="blog-posts-container" class="posts-grid">
      <!-- Posts will be loaded dynamically via JavaScript -->
    </div>
    <div id="no-results" class="no-results" style="display: none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <h3>לא נמצאו תוצאות</h3>
      <p>נסה לחפש משהו אחר או בחר קטגוריה אחרת</p>
    </div>
  </div>
</div>

<script type="module" src="{{ '/assets/js/blog.js' | relative_url }}?v={{ site.data.site.cache_bust }}"></script>

<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
    {% seo %}
  </head>
  <body class="body">
    <!-- Dynamic background -->
    <div class="dynamic-bg" aria-hidden="true">
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
    </div>
    
    {% include header.html %}
    <main class="container">
      {{ content }}
    </main>
    {% include footer.html %}
        {% include analytics.html %}
        <!-- Firebase config must load first -->
        <script type="module" src="{{ '/assets/js/firebaseConfig.js' | relative_url }}?v={{ site.data.site.cache_bust }}"></script>
        <!-- Lazy loading (load with defer for performance) -->
        <script src="{{ '/assets/js/lazy-loading.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <!-- Session tracker (load early for tracking) -->
        <script src="{{ '/assets/js/session-tracker.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <!-- Search engine (independent module) -->
        <script src="{{ '/assets/js/search-engine.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <!-- Other scripts load after Firebase is ready -->
        <script src="{{ '/assets/js/firestore-apps.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <script src="{{ '/assets/js/search-ui.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <script src="{{ '/assets/js/favorites.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <script src="{{ '/assets/js/lists-manager.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        <script src="{{ '/assets/js/list-ui.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        {% if page.url == '/pages/my-tools' %}
        <script src="{{ '/assets/js/firestore-test.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        {% endif %}
        <script src="{{ '/assets/js/app.js' | relative_url }}?v={{ site.data.site.cache_bust }}" defer></script>
        
        <!-- Blog-specific styles and scripts -->
        {% if page.layout == 'blog' or page.layout == 'blog-post' or page.url contains '/blog/' %}
        <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v={{ site.data.site.cache_bust }}">
        {% endif %}
    </body>
</html>
